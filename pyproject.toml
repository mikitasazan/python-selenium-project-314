[project]
name = "hexlet-code"
version = "0.1.0"
description = "UI-тесты канбан-доски на Selenium и pytest"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pytest==9.1.1",
  "selenium==4.47.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --durations=5"
xfail_strict = true
